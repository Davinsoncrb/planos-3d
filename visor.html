<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor 3D Interactivo — Planos CAD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #0b1622;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #f1f5f9;
      user-select: none;
    }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
    .hud-top {
      position: fixed;
      top: 16px;
      left: 16px;
      background: rgba(12, 24, 38, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(224, 165, 56, 0.45);
      border-left: 4px solid #e0a538;
      border-radius: 10px;
      padding: 12px 18px;
      max-width: 460px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .back-link {
      display: inline-block;
      margin-bottom: 6px;
      font-size: 12px;
      color: #93c5fd;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    .hud-top h1 {
      font-family: "Bahnschrift", "Segoe UI", sans-serif;
      font-size: 19px;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .hud-top p { font-size: 12.5px; color: #e9c77b; line-height: 1.35; }

    .hud-controls {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 262px;
      background: rgba(12, 24, 38, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    .hud-section-title {
      font-family: "Bahnschrift", "Segoe UI", sans-serif;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #e0a538;
      margin: 10px 0 6px;
    }
    .hud-section-title:first-child { margin-top: 0; }
    .btn-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 6px;
    }
    .btn {
      background: rgba(30, 48, 70, 0.9);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 7px;
      padding: 7px 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: center;
      text-decoration: none;
      display: block;
    }
    .btn:hover { background: rgba(45, 72, 105, 0.95); border-color: #e0a538; }
    .btn.active {
      background: #e0a538;
      color: #0f172a;
      font-weight: 700;
      border-color: #f8d483;
    }
    .btn-full { width: 100%; margin-top: 6px; padding: 8px; font-weight: 600; }
    .btn-capture { background: linear-gradient(135deg, #1d4ed8, #0284c7); border-color: #38bdf8; color: #fff; }
    .btn-drive { background: linear-gradient(135deg, #16a34a, #15803d); border-color: #4ade80; color: #fff; }
    .btn-star { background: rgba(224, 165, 56, 0.16); border-color: #e0a538; color: #f8d483; }
    .btn-star:hover { background: #e0a538; color: #0f172a; }

    .hud-bottom {
      position: fixed;
      bottom: 16px;
      left: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(12, 24, 38, 0.82);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
    }
    .badge strong {
      font-family: "Bahnschrift", "Segoe UI", sans-serif;
      color: #f6c453;
      margin-right: 4px;
    }
    #hint {
      position: fixed;
      bottom: 16px;
      right: 16px;
      font-size: 12px;
      color: rgba(226, 232, 240, 0.82);
      background: rgba(12, 24, 38, 0.72);
      padding: 6px 10px;
      border-radius: 6px;
    }
    #error-box {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(11, 22, 34, 0.95);
      padding: 24px;
      text-align: center;
    }
    @media (max-width: 720px) {
      .hud-top { max-width: calc(100vw - 32px); padding: 10px 12px; }
      .hud-top h1 { font-size: 15px; }
      .hud-top p { font-size: 12px; }
      .hud-controls {
        top: auto;
        bottom: 12px;
        right: 12px;
        left: 12px;
        width: auto;
        padding: 10px;
      }
      .hud-bottom, #hint { display: none; }
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-top">
    <a class="back-link" href="./">← Ver todos los planos</a>
    <h1 id="proj-title">Cargando modelo 3D...</h1>
    <p id="proj-sub"></p>
  </div>

  <div class="hud-controls">
    <div class="hud-section-title">Cámaras</div>
    <div id="cam-grid" class="btn-grid"></div>

    <div class="hud-section-title">Inspección Técnica</div>
    <div id="toggles-box"></div>
    <button id="btn-sun" class="btn btn-full">Modo Atardecer Dorado</button>
    <button id="btn-capture" class="btn btn-full btn-capture">Capturar Foto 3D (1:1 PNG)</button>

    <div class="hud-section-title">Descarga y Apoyo</div>
    <a id="link-drive" class="btn btn-full btn-drive" href="#" target="_blank" rel="noopener">
      Descargar Planos (PDF + DXF)
    </a>
    <a id="link-github" class="btn btn-full btn-star" href="https://github.com/drakkomaldito/planos-3d" target="_blank" rel="noopener">
      ⭐ Dar Estrella en GitHub
    </a>
  </div>

  <div id="badges-box" class="hud-bottom"></div>
  <div id="hint">Arrastra: rotar 360° · Rueda: zoom · Clic derecho: desplazar</div>
  <div id="error-box"><div><h2 style="margin-bottom:8px;">No se pudo cargar el proyecto 3D</h2><p id="error-msg"></p></div></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const params = new URLSearchParams(window.location.search);
    const projectId = (params.get("p") || "casa-playa-usa").replace(/[^a-zA-Z0-9_-]/g, "");

    async function loadProject() {
      const res = await fetch(`./datos/${projectId}.json`, { cache: "no-store" });
      if (!res.ok) throw new Error(`Proyecto "${projectId}" no encontrado (${res.status}).`);
      return res.json();
    }

    function makeWoodTex(c1, c2) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = c1; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 64; i++) {
        g.fillStyle = i % 2 === 0 ? c2 : "rgba(255,255,255,0.06)";
        g.fillRect(0, i * 8, 512, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 4);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeSidingTex() {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = "#f2f5f7"; g.fillRect(0, 0, 512, 512);
      for (let y = 0; y < 512; y += 32) {
        const grad = g.createLinearGradient(0, y, 0, y + 32);
        grad.addColorStop(0, "#ffffff");
        grad.addColorStop(0.86, "#e5ecef");
        grad.addColorStop(1, "#c2ced4");
        g.fillStyle = grad;
        g.fillRect(0, y, 512, 32);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeMetalTex() {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = "#364554"; g.fillRect(0, 0, 512, 512);
      for (let x = 0; x < 512; x += 32) {
        g.fillStyle = "#4c5f72"; g.fillRect(x, 0, 4, 512);
        g.fillStyle = "#222d38"; g.fillRect(x + 4, 0, 3, 512);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(6, 2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeGroundTex(baseColor) {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = baseColor; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 8500; i++) {
        g.fillStyle = Math.random() > 0.5 ? "rgba(120,90,50,0.16)" : "rgba(255,250,235,0.22)";
        g.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 16);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeConcreteTex(baseColor = "#cbd2d9") {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = baseColor; g.fillRect(0, 0, 512, 512);
      // Líneas sutiles de juntas de encofrado
      g.strokeStyle = "rgba(30,41,59,0.12)";
      g.lineWidth = 2;
      for (let y = 0; y < 512; y += 64) {
        g.beginPath(); g.moveTo(0, y); g.lineTo(512, y); g.stroke();
      }
      // Grano y porosidad mineral del concreto
      for (let i = 0; i < 9500; i++) {
        const v = Math.random();
        g.fillStyle = v > 0.55 ? "rgba(255,255,255,0.10)" : "rgba(15,23,42,0.11)";
        g.fillRect(Math.random() * 512, Math.random() * 512, 2 + Math.random() * 2, 2);
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 2);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makeRockTex(baseColor = "#64748b") {
      const c = document.createElement("canvas");
      c.width = 512; c.height = 512;
      const g = c.getContext("2d");
      g.fillStyle = baseColor; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 450; i++) {
        const r = 6 + Math.random() * 22;
        g.fillStyle = Math.random() > 0.5 ? "rgba(30,41,59,0.22)" : "rgba(226,232,240,0.16)";
        g.beginPath();
        g.arc(Math.random() * 512, Math.random() * 512, r, 0, Math.PI * 2);
        g.fill();
      }
      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(3, 3);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function buildMaterial(spec) {
      if (spec.type === "concrete") {
        return new THREE.MeshStandardMaterial({
          map: makeConcreteTex(spec.color || "#cfd6dc"),
          roughness: spec.roughness ?? 0.82,
          metalness: spec.metalness ?? 0.04,
        });
      }
      if (spec.type === "rock") {
        return new THREE.MeshStandardMaterial({
          map: makeRockTex(spec.color || "#5c6773"),
          roughness: spec.roughness ?? 0.94,
          metalness: spec.metalness ?? 0.04,
        });
      }
      if (spec.type === "wood") {
        return new THREE.MeshStandardMaterial({ map: makeWoodTex(spec.c1, spec.c2), roughness: spec.roughness ?? 0.78 });
      }
      if (spec.type === "siding") {
        return new THREE.MeshStandardMaterial({ map: makeSidingTex(), roughness: 0.55 });
      }
      if (spec.type === "metal_roof") {
        return new THREE.MeshStandardMaterial({ map: makeMetalTex(), roughness: 0.35, metalness: 0.45 });
      }
      if (spec.type === "glass") {
        return new THREE.MeshPhysicalMaterial({
          color: spec.color || "#7bc2e6",
          roughness: 0.08,
          metalness: 0.1,
          transmission: 0.58,
          transparent: true,
          opacity: spec.opacity ?? 0.72,
        });
      }
      return new THREE.MeshStandardMaterial({
        color: spec.color || "#ffffff",
        roughness: spec.roughness ?? 0.65,
        metalness: spec.metalness ?? 0.05,
        transparent: (spec.opacity ?? 1) < 1,
        opacity: spec.opacity ?? 1,
      });
    }

    try {
      const data = await loadProject();
      document.title = `${data.titulo} — Visor 3D`;
      document.getElementById("proj-title").textContent = data.titulo;
      document.getElementById("proj-sub").textContent = data.subtitulo;
      document.getElementById("link-drive").href = data.driveUrl;
      if (data.githubRepo) document.getElementById("link-github").href = data.githubRepo;

      const container = document.getElementById("canvas-container");
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0xcde7f7, 0.004);

      const firstCam = data.cameras[0];
      const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.3, 600);
      camera.position.set(...firstCam.pos);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      container.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.target.set(...firstCam.target);
      controls.maxPolarAngle = Math.PI * 0.62;
      controls.minDistance = 4;
      controls.maxDistance = 160;

      // Luces y Cielo
      scene.add(new THREE.HemisphereLight(0xbbe4ff, 0xe4cca0, 0.95));
      const sunLight = new THREE.DirectionalLight(0xfff6e5, 2.2);
      sunLight.position.set(55, 68, 45);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(2048, 2048);
      sunLight.shadow.camera.near = 5;
      sunLight.shadow.camera.far = 200;
      const d = 55;
      sunLight.shadow.camera.left = -d; sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d; sunLight.shadow.camera.bottom = -d;
      sunLight.shadow.bias = -0.0005;
      scene.add(sunLight);

      const skyMat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        uniforms: {
          topColor: { value: new THREE.Color(0x2a76c7) },
          bottomColor: { value: new THREE.Color(0xdcf1ff) },
        },
        vertexShader: `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
        fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; varying vec3 vW; void main(){ float h=normalize(vW).y; gl_FragColor=vec4(mix(bottomColor,topColor,pow(max(h,0.0),0.65)),1.0); }`,
      });
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(280, 32, 20), skyMat));

      // Grupos logicos por nivel
      const groups = {
        foundation: new THREE.Group(),
        base: new THREE.Group(),
        upper: new THREE.Group(),
        roof: new THREE.Group(),
      };
      Object.values(groups).forEach((g) => scene.add(g));

      // Materiales del proyecto
      const mats = {};
      for (const [k, spec] of Object.entries(data.materials || {})) {
        mats[k] = buildMaterial(spec);
      }

      // Terreno
      const env = data.environment || {};
      const gSize = env.groundSize || 240;
      const gGeo = new THREE.PlaneGeometry(gSize, gSize, 72, 72);
      gGeo.rotateX(-Math.PI / 2);
      if (env.groundType === "coastal_sand") {
        const gp = gGeo.attributes.position;
        for (let i = 0; i < gp.count; i++) {
          const px = gp.getX(i), pz = gp.getZ(i);
          let h = 0;
          if (pz > 28) h = -Math.min(7.5, (pz - 28) * 0.14);
          else if (Math.hypot(px, pz) > 26) h = Math.sin(px * 0.08) * Math.cos(pz * 0.07) * 1.1;
          gp.setY(i, h);
        }
        gGeo.computeVertexNormals();
      } else if (env.groundType === "river_bank") {
        const gp = gGeo.attributes.position;
        for (let i = 0; i < gp.count; i++) {
          const px = gp.getX(i), pz = gp.getZ(i);
          let h = -0.95;
          if (pz < -3.2) {
            // Cauce profundo del rio
            const t = Math.min(1, (-3.2 - pz) / 3.0);
            h = -0.95 - t * 1.15;
          } else if (pz > 2.4) {
            // Talud subiendo a la terraza agricola de riego (+1.75 m)
            const t = Math.min(1, (pz - 2.4) / 2.6);
            h = -0.95 + t * 2.70;
          }
          // Suave ondulacion natural fuera de la zona de obra
          if (Math.abs(px) > 7.5 || pz > 8.5) {
            h += Math.sin(px * 0.18) * Math.cos(pz * 0.16) * 0.18;
          }
          gp.setY(i, h);
        }
        gGeo.computeVertexNormals();
      }
      const matGround = new THREE.MeshStandardMaterial({
        map: makeGroundTex(env.groundColor || "#e6d2a8"),
        roughness: 0.94,
        transparent: true,
        opacity: 1.0,
      });
      const groundMesh = new THREE.Mesh(gGeo, matGround);
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      let scourPlane = null;
      if (env.scourPlaneY !== undefined) {
        scourPlane = new THREE.Mesh(
          new THREE.PlaneGeometry(36, 52),
          new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.22, side: THREE.DoubleSide })
        );
        scourPlane.rotation.x = -Math.PI / 2;
        scourPlane.position.y = env.scourPlaneY;
        scourPlane.visible = false;
        scene.add(scourPlane);
      }

      let oceanGeo = null;
      if (env.ocean) {
        oceanGeo = new THREE.PlaneGeometry(300, 180, 64, 42);
        oceanGeo.rotateX(-Math.PI / 2);
        const oceanMesh = new THREE.Mesh(
          oceanGeo,
          new THREE.MeshPhysicalMaterial({ color: 0x0b7aa6, roughness: 0.14, metalness: 0.12, transparent: true, opacity: 0.84 })
        );
        oceanMesh.position.set(0, env.ocean.y, env.ocean.z);
        scene.add(oceanMesh);
      }

      let riverGeo = null;
      if (env.river) {
        riverGeo = new THREE.PlaneGeometry(env.river.w || 56, env.river.d || 22, 84, 30);
        riverGeo.rotateX(-Math.PI / 2);
        const riverMesh = new THREE.Mesh(
          riverGeo,
          new THREE.MeshPhysicalMaterial({
            color: env.river.color || 0x0284c7,
            roughness: 0.10,
            metalness: 0.14,
            transmission: 0.35,
            transparent: true,
            opacity: env.river.opacity ?? 0.82,
          })
        );
        riverMesh.position.set(env.river.x || 0, env.river.y ?? 0.0, env.river.z ?? -13.5);
        riverMesh.receiveShadow = true;
        scene.add(riverMesh);
      }

      let floodMesh = null;
      if (env.flood) {
        const fGeo = new THREE.PlaneGeometry(240, 240, 32, 32);
        fGeo.rotateX(-Math.PI / 2);
        floodMesh = new THREE.Mesh(
          fGeo,
          new THREE.MeshPhysicalMaterial({ color: 0x0ea5e9, roughness: 0.12, transparent: true, opacity: 0.62 })
        );
        floodMesh.position.y = -3.0;
        floodMesh.visible = false;
        scene.add(floodMesh);
      }

      // Geometria de cajas desde JSON (soporta boxes o elements)
      const listaCajas = data.boxes || data.elements || [];
      for (const b of listaCajas) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(b.w, b.h, b.d), mats[b.mat] || mats.trim || new THREE.MeshStandardMaterial({ color: 0x94a3b8 }));
        mesh.position.set(b.x, b.y, b.z);
        if (b.rotX) mesh.rotation.x = b.rotX;
        if (b.rotY) mesh.rotation.y = b.rotY;
        if (b.rotZ) mesh.rotation.z = b.rotZ;
        const sh = b.shadow !== false;
        mesh.castShadow = sh;
        mesh.receiveShadow = sh;
        const grpName = b.group === "lower" ? "base" : (b.group || "base");
        (groups[grpName] || groups.base).add(mesh);
      }

      // Geometria de cilindros opcionales
      for (const c of data.cylinders || []) {
        const rTop = c.rt !== undefined ? c.rt : (c.r || 0.5);
        const rBot = c.rb !== undefined ? c.rb : (c.r || 0.5);
        const geoC = new THREE.CylinderGeometry(rTop, rBot, c.h || 1.0, c.seg || 24);
        const meshC = new THREE.Mesh(geoC, mats[c.mat] || mats.trim || new THREE.MeshStandardMaterial({ color: 0x3b82f6 }));
        meshC.position.set(c.x, c.y, c.z);
        if (c.rotX) meshC.rotation.x = c.rotX;
        if (c.rotY) meshC.rotation.y = c.rotY;
        if (c.rotZ) meshC.rotation.z = c.rotZ;
        const sh = c.shadow !== false;
        meshC.castShadow = sh;
        meshC.receiveShadow = sh;
        const grpName = c.group === "lower" ? "base" : (c.group || "base");
        (groups[grpName] || groups.base).add(meshC);
      }

      // Arriostramientos diagonales
      for (const br of data.braces || []) {
        const p1 = new THREE.Vector3(...br.p1);
        const p2 = new THREE.Vector3(...br.p2);
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(br.t || 0.32, p1.distanceTo(p2), br.t || 0.32), mats[br.mat]);
        mesh.position.copy(p1).add(p2).multiplyScalar(0.5);
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p2.clone().sub(p1).normalize());
        mesh.castShadow = true;
        groups.foundation.add(mesh);
      }

      // Techos a 4 aguas (Hip Roof)
      for (const hr of data.hipRoofs || []) {
        const { rW, rL, ridgeL, rH, rY } = hr;
        const v = [-rW, rY, rL, rW, rY, rL, rW, rY, -rL, -rW, rY, -rL, 0, rY + rH, ridgeL, 0, rY + rH, -ridgeL];
        const idx = [0, 1, 4, 1, 2, 5, 1, 5, 4, 2, 3, 5, 3, 0, 4, 3, 4, 5];
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
        geo.setIndex(idx);
        geo.computeVertexNormals();
        const m = new THREE.Mesh(geo, mats[hr.mat]);
        m.castShadow = true;
        m.receiveShadow = true;
        groups.roof.add(m);
      }

      // Palmeras / Vegetacion
      for (const [px, pz, sc] of env.palms || []) {
        const g = new THREE.Group();
        const tMat = new THREE.MeshStandardMaterial({ color: 0x8b6f4e, roughness: 0.92 });
        const lMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.72, side: THREE.DoubleSide });
        for (let i = 0; i < 8; i++) {
          const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.42 - i * 0.03, 0.48 - i * 0.03, 2.5, 8), tMat);
          seg.position.set(Math.sin(i * 0.22) * 1.1, 1.2 + i * 2.3, Math.cos(i * 0.18) * 0.5);
          seg.rotation.z = -0.08 * i;
          seg.castShadow = true;
          g.add(seg);
        }
        const top = new THREE.Vector3(Math.sin(7 * 0.22) * 1.1, 18.6, Math.cos(7 * 0.18) * 0.5);
        for (let a = 0; a < 7; a++) {
          const ang = (a / 7) * Math.PI * 2;
          const fr = new THREE.Mesh(new THREE.ConeGeometry(1.4, 8.5, 4), lMat);
          fr.scale.set(0.5, 1, 0.18);
          fr.position.copy(top).add(new THREE.Vector3(Math.cos(ang) * 3.4, -0.8, Math.sin(ang) * 3.4));
          fr.rotation.z = Math.cos(ang) * 1.25;
          fr.rotation.x = -Math.sin(ang) * 1.25;
          fr.castShadow = true;
          g.add(fr);
        }
        g.position.set(px, 0, pz);
        g.scale.setScalar(sc);
        scene.add(g);
      }

      // Arboles ribereños / Vegetacion organica
      for (const [tx, ty, tz, sc] of env.trees || []) {
        const g = new THREE.Group();
        const tMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.92 });
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.24, 2.2, 8), tMat);
        trunk.position.y = 1.1;
        trunk.castShadow = true;
        g.add(trunk);
        const greens = [0x2d6a4f, 0x40916c, 0x1b4332, 0x52b788];
        const puffs = [
          [0, 2.7, 0, 1.15],
          [0.65, 2.3, 0.45, 0.82],
          [-0.65, 2.35, -0.35, 0.88],
          [0.15, 3.25, -0.25, 0.78],
          [-0.35, 2.2, 0.65, 0.72],
        ];
        puffs.forEach(([ox, oy, oz, rad], idx) => {
          const leaf = new THREE.Mesh(
            new THREE.DodecahedronGeometry(rad, 1),
            new THREE.MeshStandardMaterial({ color: greens[idx % greens.length], roughness: 0.82 })
          );
          leaf.position.set(ox, oy, oz);
          leaf.castShadow = true;
          leaf.receiveShadow = true;
          g.add(leaf);
        });
        g.position.set(tx, ty, tz);
        g.scale.setScalar(sc || 1.0);
        scene.add(g);
      }

      // UI dinamica: Camaras, Toggles y Badges
      const camGrid = document.getElementById("cam-grid");
      for (const c of data.cameras || []) {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = c.label;
        btn.onclick = () => {
          camera.position.set(...c.pos);
          controls.target.set(...c.target);
          controls.update();
        };
        camGrid.appendChild(btn);
      }

      const badgesBox = document.getElementById("badges-box");
      for (const b of data.badges || []) {
        const div = document.createElement("div");
        div.className = "badge";
        const st = document.createElement("strong");
        st.textContent = b.k;
        div.appendChild(st);
        div.appendChild(document.createTextNode(b.v));
        badgesBox.appendChild(div);
      }

      const togglesBox = document.getElementById("toggles-box");
      const tog = data.toggles || {};
      let xrayOn = false, floodOn = false, roofUp = false, upperUp = false, sunsetOn = false;
      let targetRoofY = 0, targetUpperY = 0, targetFloodY = -3.0;

      if (tog.xrayLabel) {
        const b = document.createElement("button");
        b.className = "btn btn-full";
        b.textContent = tog.xrayLabel;
        b.onclick = () => {
          xrayOn = !xrayOn;
          matGround.opacity = xrayOn ? 0.28 : 1.0;
          if (scourPlane) scourPlane.visible = xrayOn;
          b.classList.toggle("active", xrayOn);
        };
        togglesBox.appendChild(b);
      }
      if (env.flood) {
        const b = document.createElement("button");
        b.className = "btn btn-full";
        b.textContent = env.flood.label;
        b.onclick = () => {
          floodOn = !floodOn;
          floodMesh.visible = true;
          targetFloodY = floodOn ? env.flood.y : -3.0;
          b.classList.toggle("active", floodOn);
        };
        togglesBox.appendChild(b);
      }
      if (tog.roofLabel) {
        const b = document.createElement("button");
        b.className = "btn btn-full";
        b.textContent = tog.roofLabel;
        b.onclick = () => {
          roofUp = !roofUp;
          targetRoofY = roofUp ? (tog.roofLiftY || 14.0) : 0.0;
          b.classList.toggle("active", roofUp);
        };
        togglesBox.appendChild(b);
      }
      if (tog.upperLabel) {
        const b = document.createElement("button");
        b.className = "btn btn-full";
        b.textContent = tog.upperLabel;
        b.onclick = () => {
          upperUp = !upperUp;
          targetUpperY = upperUp ? (tog.upperLiftY || 10.0) : 0.0;
          b.classList.toggle("active", upperUp);
        };
        togglesBox.appendChild(b);
      }

      document.getElementById("btn-sun").onclick = (ev) => {
        sunsetOn = !sunsetOn;
        if (sunsetOn) {
          skyMat.uniforms.topColor.value.set(0x1e2952);
          skyMat.uniforms.bottomColor.value.set(0xf59e56);
          sunLight.color.set(0xffb56b);
          sunLight.position.set(-70, 22, 60);
          sunLight.intensity = 2.4;
          scene.fog.color.set(0xdf9c6e);
        } else {
          skyMat.uniforms.topColor.value.set(0x2a76c7);
          skyMat.uniforms.bottomColor.value.set(0xdcf1ff);
          sunLight.color.set(0xfff6e5);
          sunLight.position.set(55, 68, 45);
          sunLight.intensity = 2.2;
          scene.fog.color.set(0xcde7f7);
        }
        ev.currentTarget.classList.toggle("active", sunsetOn);
      };

      document.getElementById("btn-capture").onclick = () => {
        const size = 1080;
        const ow = window.innerWidth, oh = window.innerHeight;
        camera.aspect = 1.0;
        camera.updateProjectionMatrix();
        renderer.setSize(size, size);
        renderer.render(scene, camera);
        const a = document.createElement("a");
        a.href = renderer.domElement.toDataURL("image/png");
        a.download = `${projectId}_3d_1_1.png`;
        a.click();
        camera.aspect = ow / oh;
        camera.updateProjectionMatrix();
        renderer.setSize(ow, oh);
      };

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        if (oceanGeo) {
          const op = oceanGeo.attributes.position;
          for (let i = 0; i < op.count; i++) {
            op.setY(i, Math.sin(op.getZ(i) * 0.14 + t * 1.8) * 0.42 + Math.cos(op.getX(i) * 0.09 + t * 1.2) * 0.22);
          }
          op.needsUpdate = true;
        }
        if (riverGeo) {
          const rp = riverGeo.attributes.position;
          for (let i = 0; i < rp.count; i++) {
            // Ondas fluyendo claramente de -X (Aguas Arriba) hacia +X (Aguas Abajo)
            const rx = rp.getX(i), rz = rp.getZ(i);
            rp.setY(i, Math.sin(rx * 0.55 - t * 3.4) * 0.075 + Math.cos(rz * 0.75 - t * 2.1) * 0.045);
          }
          rp.needsUpdate = true;
          riverGeo.computeVertexNormals();
        }
        groups.upper.position.y += (targetUpperY - groups.upper.position.y) * 0.08;
        groups.roof.position.y += ((targetRoofY + groups.upper.position.y) - groups.roof.position.y) * 0.08;
        if (floodMesh && floodMesh.visible) {
          floodMesh.position.y += (targetFloodY - floodMesh.position.y) * 0.06;
          if (!floodOn && floodMesh.position.y < -2.6) floodMesh.visible = false;
        }
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    } catch (err) {
      document.getElementById("error-box").style.display = "flex";
      document.getElementById("error-msg").textContent = err.message;
    }
  </script>
</body>
</html>
